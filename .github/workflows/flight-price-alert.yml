name: Flight Price Monitor

on:
  schedule:
    # Ejecucion a la 1am, 9am, 17pm y 22pm CEST (07:00, 15:00, 20:00, 23:00 UTC)
    - cron: "0 7,15,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore flight price history
        uses: actions/cache@v4
        with:
          path: flight_price_history_v5.json
          key: flight-history-v5-${{ github.run_id }}
          restore-keys: |
            flight-history-v5-

      - name: Run flight price monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python check_flights.py
